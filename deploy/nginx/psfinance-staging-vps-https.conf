# HTTPS focal do staging PSFINANCE no hostname técnico da VPS.
# O certificado deste hostname já é gerenciado pelo Certbot na VPS.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vps69143.publiccloud.com.br;

    ssl_certificate /etc/letsencrypt/live/vps69143.publiccloud.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vps69143.publiccloud.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/psfinance_staging_https_access.log;
    error_log /var/log/nginx/psfinance_staging_https_error.log;

    location = /staging/psfinance {
        proxy_pass http://127.0.0.1:5104;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /staging/psfinance/ {
        proxy_pass http://127.0.0.1:5104;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        return 404;
    }
}
