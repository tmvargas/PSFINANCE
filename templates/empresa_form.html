{% extends "base.html" %}
{% if empresa %}{% set titulo_pagina = "Editar empresa" %}{% else %}{% set titulo_pagina = "Nova empresa" %}{% endif %}{% block title %}{{ titulo_pagina }}{% endblock %}{% block content %}<h1 class="h4 mb-3">{{ titulo_pagina }}</h1><form method="post" class="border rounded p-3 bg-white"><input name="nome" class="form-control mb-2" required value="{{ empresa.nome if empresa else '' }}"><select name="tipo_empresa" class="form-select mb-2" required>{% set tipo_sel = empresa.tipo_empresa if empresa else 'EMPRESA' %}{% for tipo in tipos_empresa %}<option value="{{ tipo }}" {% if tipo_sel == tipo %}selected{% endif %}>{{ tipo }}</option>{% endfor %}</select><input name="cnpj" class="form-control mb-2" value="{{ empresa.cnpj if empresa else '' }}"><input name="codigo_externo" class="form-control mb-2" value="{{ empresa.codigo_externo if empresa else '' }}"><input type="checkbox" name="ativa" checked> Ativa<br><button class="btn btn-success" type="submit">Salvar</button> <a class="btn btn-secondary" href="{{ url_for('financeiro.listar_empresas') }}">Cancelar</a></form>{% endblock %}
