{% extends "base.html" %}

{% if empresa and empresa.id %}
  {% set titulo_pagina = "Editar empresa" %}
{% else %}
  {% set titulo_pagina = "Nova empresa" %}
{% endif %}

{% block title %}{{ titulo_pagina }}{% endblock %}

{% block content %}
  <h1 class="h4 mb-3">{{ titulo_pagina }}</h1>

  <form method="post" class="border rounded p-3 bg-white">
    <div class="row g-3 mb-3">
      <div class="col-md-3">
        <label class="form-label">Código</label>
        <input
          type="text"
          name="codigo"
          class="form-control"
          required
          value="{{ empresa.codigo if empresa else '' }}"
        >
      </div>

      <div class="col-md-6">
        <label class="form-label">Nome da empresa</label>
        <input
          type="text"
          name="nome"
          class="form-control"
          required
          value="{{ empresa.nome if empresa else '' }}"
        >
      </div>

      <div class="col-md-3">
        <label class="form-label">Tipo</label>
        <select name="tipo_empresa" class="form-select" required>
          {% set tipo_sel = empresa.tipo_empresa if empresa else '' %}
          <option value="">Selecione...</option>
          {% for tipo in tipos_empresa %}
            <option value="{{ tipo }}" {% if tipo_sel == tipo %}selected{% endif %}>{{ tipo }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="col-md-4">
        <label class="form-label">Código externo</label>
        <input
          type="text"
          name="codigo_externo"
          class="form-control"
          value="{{ empresa.codigo_externo if empresa else '' }}"
        >
      </div>

      <div class="col-md-8">
        <label class="form-label">Observação</label>
        <input
          type="text"
          name="observacao"
          class="form-control"
          value="{{ empresa.observacao if empresa else '' }}"
        >
      </div>
    </div>

    <button type="submit" class="btn btn-success">Salvar</button>
    <a href="{{ url_for('financeiro.listar_empresas') }}" class="btn btn-secondary">Cancelar</a>
  </form>
{% endblock %}
