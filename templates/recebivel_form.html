{% extends "base.html" %}{% block title %}Recebível{% endblock %}{% block content %}<h1 class="h4">{{ 'Copiar' if copia else ('Editar' if recebivel else 'Novo') }} recebível</h1><form method="post" class="card p-3"><div class="row g-3"><div class="col-md-4"><label>Documento</label><select name="id_doc" class="form-select" required>{% for x in documentos %}<option value="{{x.id_doc}}" {% if recebivel and x.id_doc==recebivel.id_doc %}selected{% endif %}>{{x.tipo_doc}} - {{x.nome_doc}}</option>{% endfor %}</select></div><div class="col-md-4"><label>Número</label><input name="nr_documento" class="form-control" required value="{{recebivel.nr_documento if recebivel else ''}}"></div><div class="col-md-4"><label>Cliente</label><select name="id_cliente" class="form-select" required>{% for x in clientes %}<option value="{{x.id_cliente}}" {% if recebivel and x.id_cliente==recebivel.id_cliente %}selected{% endif %}>{{x.nome}}</option>{% endfor %}</select></div><div class="col-md-4"><label>Empresa</label><select name="id_empresa" class="form-select" required>{% for x in empresas %}<option value="{{x.id_empresa}}" {% if recebivel and x.id_empresa==recebivel.id_empresa %}selected{% endif %}>{{x.codigo}} - {{x.nome}}</option>{% endfor %}</select></div><div class="col-md-4"><label>Plano financeiro de entrada</label><select name="id_plano" class="form-select" required>{% for x in planos %}<option value="{{x.id_plano}}" {% if recebivel and x.id_plano==recebivel.id_plano %}selected{% endif %}>{{x.cod_estrutural}} - {{x.nome_conta}}</option>{% endfor %}</select></div><div class="col-md-2"><label>Valor</label><input name="valor" type="number" step="0.01" class="form-control" required value="{{recebivel.valor if recebivel else ''}}"></div><div class="col-md-2"><label>Parcelas</label><input name="parcelas" type="number" min="1" max="999" class="form-control" value="1" {% if recebivel and not copia %}readonly{% endif %}></div><div class="col-md-3"><label>Emissão</label><input name="emissao" type="date" class="form-control" required value="{{recebivel.emissao if recebivel else ''}}"></div><div class="col-md-3"><label>1º vencimento</label><input name="vencimento" type="date" class="form-control" required value="{{recebivel.vencimento if recebivel else ''}}"></div><div class="col-12"><label>Observação</label><textarea name="observacao" class="form-control">{{recebivel.observacao if recebivel else ''}}</textarea></div></div><div class="mt-3"><button class="btn btn-success">Salvar</button> <a class="btn btn-secondary" href="{{url_for('financeiro.listar_recebiveis')}}">Cancelar</a></div></form>{% endblock %}
