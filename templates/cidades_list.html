{% extends "base.html" %}{% block title %}Cidades{% endblock %}{% block content %}<div class="consultation-page"><div class="consultation-header"><div><div class="consultation-kicker">Cadastros de apoio</div><h1 class="h4 mb-0">Consulta de cidades</h1></div><div class="consultation-actions"><a href="{{ url_for('financeiro.nova_cidade') }}" class="btn btn-sm btn-primary">Nova cidade</a></div></div><div class="consultation-table-shell"><div class="table-responsive"><table class="table table-sm consultation-table"><thead><tr><th>Código</th><th>Cidade</th><th>Ações</th></tr></thead><tbody>{% for c in cidades %}<tr><td>{{ c.id }}</td><td>{{ c.nome }}</td><td><a href="{{ url_for('financeiro.editar_cidade', id_cidade=c.id) }}" class="consultation-action" title="Editar"><svg class="icon"><use href="#icon-pencil"></use></svg></a><form method="post" action="{{ url_for('financeiro.excluir_cidade', id_cidade=c.id) }}" class="consultation-action-form" onsubmit="return confirm('Excluir esta cidade?')"><button class="consultation-action consultation-action-danger" title="Excluir"><svg class="icon"><use href="#icon-trash"></use></svg></button></form></td></tr>{% endfor %}</tbody></table></div></div></div>{% endblock %}
