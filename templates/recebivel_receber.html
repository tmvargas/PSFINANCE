{% extends "base.html" %}{% block title %}Receber{% endblock %}{% block content %}<h1 class="h4">Receber {{recebivel.nr_documento}}</h1><p>Cliente: {{recebivel.cliente.nome}} — Saldo: R$ {{'%.2f'|format(saldo)}}</p><form method="post" class="card p-3"><label>Conta</label><select name="id_conta" class="form-select" required>{% for x in contas %}<option value="{{x.id_conta}}">{{x.descricao}}</option>{% endfor %}</select><label class="mt-3">Valor</label><input name="valor" type="number" step="0.01" max="{{saldo}}" class="form-control" required><button class="btn btn-success mt-3">Confirmar recebimento</button></form>{% endblock %}
