{% extends "base.html" %}
{% if centro_custo %}{% set titulo_pagina = "Editar centro de custo" %}{% else %}{% set titulo_pagina = "Novo centro de custo" %}{% endif %}{% block title %}{{ titulo_pagina }}{% endblock %}{% block content %}<h1 class="h4 mb-3">{{ titulo_pagina }}</h1><form method="post" class="border rounded p-3 bg-white"><select name="id_empresa" class="form-select mb-2" required><option value="">Selecione...</option>{% for empresa in empresas %}<option value="{{ empresa.id }}">{{ empresa.nome }} - {{ empresa.tipo_empresa }}</option>{% endfor %}</select><input name="codigo" class="form-control mb-2" required value="{{ centro_custo.codigo if centro_custo else '' }}"><input name="nome" class="form-control mb-2" required value="{{ centro_custo.nome if centro_custo else '' }}"><input name="codigo_externo" class="form-control mb-2" value="{{ centro_custo.codigo_externo if centro_custo else '' }}"><input type="checkbox" name="ativo" checked> Ativo<br><button class="btn btn-success" type="submit">Salvar</button> <a class="btn btn-secondary" href="{{ url_for('financeiro.listar_centros_custo') }}">Cancelar</a></form>{% endblock %}
